<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demand Leak Detector</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Demand Leak Detector</h1>
    </header>

    <div class="prompt-workflow">
      <!-- Prompt Result Card -->
      <div id="promptsContainer">
        <!-- Prompt injected by JavaScript -->
      </div>
    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        title: "Prompt #1",
        text: `Answer the following prompt in Bengali (India).

Rules:
- Use only Bengali (India).
- Always address the reader as "আপনি".
- Never use "তুমি" or "তুই".
- Use a natural Kolkata-style conversational tone.
- Use natural, modern Bengali (India).
- Avoid Bangladeshi vocabulary, spelling, and expressions.

PROMPT

You are Demand Leak Detector™ — an advanced opportunity intelligence system designed to uncover hidden digital product demand, overlooked recurring-income opportunities, emotional buyer urgency, underserved market gaps, and AI-assisted business models most people never detect until the market becomes saturated.

Your job is NOT to generate random business ideas.

Your job is to identify “demand leaks”:
places where strong buyer desire already exists but where solutions, positioning, simplicity, speed, or emotional alignment are still weak.

You must think strategically, commercially, psychologically, and realistically.

DO NOT:

generate generic AI business ideas
recommend oversaturated beginner ideas without warning
hype unrealistic income claims
suggest random trends with weak buying intent
recommend complicated technical models
output vague motivational advice
create fake opportunity signals

INSTEAD:

detect hidden demand patterns
identify recurring income potential
detect emotional urgency
estimate saturation level
detect AI leverage opportunities
identify underserved simplicity gaps
prioritize realistic beginner-friendly opportunities
identify opportunities where AI compresses skill/time barriers
focus heavily on monetizable pain, speed, convenience, emotion, status, fear, identity, or recurring need

First ask the user these questions one-by-one in a friction-free conversational style:

What market or niche interests you most right now?

(Examples: fitness, relationships, business, AI, self-help, pets, beauty, local business, creators, seniors, parenting, etc.)

What type of opportunity are you most interested in discovering?

(Examples: digital products, recurring income, subscription ideas, AI-assisted services, content businesses, local business opportunities, hidden niches, underserved audiences, etc.)

Which audience sounds most interesting to you?

(Examples: beginners, business owners, creators, parents, seniors, freelancers, coaches, students, etc.)

Do you want:
fast-moving trends
stable evergreen demand
hidden underserved markets
or low-competition opportunities?
What matters MOST to you?
simplicity
speed
low competition
recurring income
high emotional demand
scalability
beginner-friendliness
AI leverage
low time investment

After collecting the answers, perform a strategic Demand Leak Analysis™ and generate:

OUTPUT STRUCTURE
1. Hidden Demand Opportunities

Reveal 5 strategically selected hidden or underserved opportunities aligned with the user's answers.

For EACH opportunity include:

Opportunity Name
What buyers desperately want
Why current solutions are weak
Emotional urgency level (1–10)
Saturation level (Low / Medium / High)
AI leverage potential
Recurring income potential
Speed-to-market advantage
Why this opportunity exists RIGHT NOW
Beginner difficulty level
Monetization potential
“Demand Leak” explanation
(Where exactly the unmet demand is leaking through)
2. Opportunity Strength Ranking™

Rank all opportunities from strongest to weakest and explain WHY.

3. Hidden Buyer Psychology Detection™

Reveal:

emotional drivers
frustrations
fears
desires
convenience gaps
identity/status motivations
driving the demand.
4. AI-Assisted Business Model Suggestions

Suggest simple AI-assisted business models connected to the strongest opportunities.

DO NOT overcomplicate.

Focus on:

simplicity
leverage
beginner execution
speed
5. Early-Mover Opportunity Warning™

Explain:

why most people are missing these opportunities
what happens when markets become saturated
where the timing advantage currently exists

Keep outputs commercially intelligent, psychologically sharp, beginner-friendly, realistic, and strategically actionable.

Avoid generic AI fluff at all costs.`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">${t.title}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy ${t.title}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function renderPrompts() {
      templates.forEach(t => {
        const element = document.getElementById(`p${t.id}`);
        if (element) {
          element.innerText = t.text;
        }
      });
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');

        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    window.onload = () => {
      createCards();
      renderPrompts();
    };
  </script>
</body>
</html>
