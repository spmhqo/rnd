<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Answer A Reader's Question</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sub-header {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      min-height: 120px;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.7;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .sub-header { font-size: 1rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Answer A Reader's Question</h1>
      <p class="sub-header">(for community content)</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Multiline Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data</span>
          <button class="clear-btn" onclick="resetInput('inputReaderQuestion')">Reset</button>
        </div>
        <label for="inputReaderQuestion">[রীডারের সরাসরি প্রশ্ন]</label>
        <textarea id="inputReaderQuestion" class="dynamic-input" placeholder="রীডারের সরাসরি প্রশ্নটি এখানে লিখুন বা পেস্ট করুন..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt Result Card -->
      <div id="promptsContainer">
        <!-- Prompt card injected by JavaScript -->
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        text: `নিচে দেওয়া রীডারের প্রশ্নটির একটি সম্পূর্ণ, সত্যনিষ্ঠ ও তথ্যসমৃদ্ধ উত্তর লিখুন।

উত্তর লেখার সময়:
- সত্য ও বাস্তব তথ্যের ভিত্তিতে উত্তর দেবেন। অনুমানকে সত্য হিসেবে উপস্থাপন করবেন না।
- প্রয়োজনীয় কোনও তথ্য, ব্যাখ্যা, সতর্কতা বা গুরুত্বপূর্ণ দিক বাদ দেবেন না (No Under-Delivery of Information)।
- শুধু সমস্যাটি ব্যাখ্যা করবেন না; সমস্যাটি সমাধান করার জন্য রীডারকে প্রয়োজনীয় জ্ঞান, কার্যকর নির্দেশনা ও বাস্তবসম্মত পদক্ষেপ দেবেন।
- এমনভাবে বোঝাবেন, যাতে রীডার নিজেই বিষয়টি বুঝতে পারেন এবং নিজের সিদ্ধান্ত নিতে ও সমস্যা সমাধান করতে সক্ষম হন।
- অপ্রয়োজনীয় কথা, অতিরঞ্জন বা ভিত্তিহীন আশ্বাস এড়িয়ে চলবেন।
- প্রশ্নকর্তা বা প্রশ্নকর্তীর পরিচয় সম্পূর্ণ গোপন রাখবেন।

প্রকাশের মাধ্যম: Facebook Private Group।

মূল উদ্দেশ্য: রীডারকে শুধু তথ্য দেওয়া নয়, তাঁকে নিজের সমস্যার সমাধান করতে সক্ষম করে তোলা।

এমন একটি স্বাভাবিক, সুসংগঠিত ও সরাসরি প্রকাশযোগ্য উত্তর লিখুন।

[রীডারের সরাসরি প্রশ্ন]`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const questionVal = document.getElementById('inputReaderQuestion').value.trim() || "[রীডারের সরাসরি প্রশ্ন]";

      templates.forEach(t => {
        let updatedText = t.text;
        if (t.id === 1) {
          updatedText = updatedText.split('[রীডারের সরাসরি প্রশ্ন]').join(questionVal);
        }
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
</body>
</html>
