<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Index Group Posts</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sub-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .sub-header { font-size: 1rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Index Group Posts</h1>
      <p class="sub-header">(in a blogger blog page)</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Multiline Input Card 1 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data 1</span>
          <button class="clear-btn" onclick="resetInput('inputTitle')">Reset</button>
        </div>
        <label for="inputTitle">[YOUR POST TITLE]</label>
        <textarea id="inputTitle" class="dynamic-input" placeholder="Type or paste YOUR POST TITLE here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Multiline Input Card 2 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data 2</span>
          <button class="clear-btn" onclick="resetInput('inputDesc')">Reset</button>
        </div>
        <label for="inputDesc">[YOUR SHORT POST DESCRIPTION]</label>
        <textarea id="inputDesc" class="dynamic-input" placeholder="Type or paste YOUR SHORT POST DESCRIPTION here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Multiline Input Card 3 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data 3</span>
          <button class="clear-btn" onclick="resetInput('inputBtn')">Reset</button>
        </div>
        <label for="inputBtn">[YOUR BUTTON TEXT]</label>
        <textarea id="inputBtn" class="dynamic-input" placeholder="Type or paste YOUR BUTTON TEXT here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt Result Cards -->
      <div id="promptsContainer">
        <!-- Prompts injected by JavaScript -->
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        text: `<div style="max-width: 600px; margin: 0 auto 16px auto; padding: 18px 20px; border: 1px solid #e2e8e9; border-radius: 10px; background: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); font-family: 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans Bengali', 'Noto Sans Devanagari', sans-serif; box-sizing: border-box;">

  <!-- Post Title (18px matching Part 1) -->
  <h2 style="margin: 0 0 8px 0; font-size: 18px; font-weight: 600; line-height: 1.4; color: #1e7087; overflow-wrap: anywhere;">
    [YOUR POST TITLE]
  </h2>

  <!-- Post Description (Proportional 15px body) -->
  <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5; color: #444444; overflow-wrap: anywhere;">
    [YOUR SHORT POST DESCRIPTION]
  </p>

  <!-- Read Post Button (Compact & Balanced) -->
  <a href="YOUR_POST_URL"
     target="_blank"
     rel="noopener noreferrer"
     style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 15px; background-color: #1e7087; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 500; line-height: 1.4; box-sizing: border-box; overflow-wrap: anywhere;">
    <span>[YOUR BUTTON TEXT]</span>
    <span style="font-size: 14px;">→</span>
  </a>

</div>`
      },
      {
        id: 2,
        text: `Read the Full Post →`
      },
      {
        id: 3,
        text: `সম্পূর্ণ পোস্ট পড়ুন →`
      },
      {
        id: 4,
        text: `पूरा पोस्ट पढ़ें →`
      },
      {
        id: 5,
        text: `<div style="padding-bottom: 20px;"></div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; color: #444; line-height: 1.4;">
  
  <!-- Facebook Section -->
  <a href="https://www.facebook.com/profile.php?id=61595606807909" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #1e7087; font-weight: 500;">
    <span>Follow me on Facebook for regular updates:</span>
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background-color: #8fa87e; flex-shrink: 0;">
      <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: #000000; display: block;">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
    </span>
  </a>

  <!-- Divider -->
  <span style="color: #bbb; user-select: none;">|</span>

  <!-- Email Section -->
  <a href="mailto:spmhqo@gmail.com" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #1e7087; font-weight: 500;">
    <span>Questions? Email me:</span>
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background-color: #8fa87e; flex-shrink: 0;">
      <!-- Email SVG Icon -->
      <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: #000000; display: block;">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </span>
  </a>

</div>`
      },
      {
        id: 6,
        text: `<div style="padding-bottom: 20px;"></div>`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const titleVal = document.getElementById('inputTitle').value.trim() || "[YOUR POST TITLE]";
      const descVal = document.getElementById('inputDesc').value.trim() || "[YOUR SHORT POST DESCRIPTION]";
      const btnVal = document.getElementById('inputBtn').value.trim() || "[YOUR BUTTON TEXT]";

      templates.forEach(t => {
        let updatedText = t.text;
        if (t.id === 1) {
          updatedText = updatedText
            .split('[YOUR POST TITLE]').join(titleVal)
            .split('[YOUR SHORT POST DESCRIPTION]').join(descVal)
            .split('[YOUR BUTTON TEXT]').join(btnVal);
        }
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
</body>
</html>
