<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R&D - (my process)</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 8px;
    }

    .sub-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
    }

    /* Filter & Reset Bar */
    .filter-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 35px;
      display: flex;
      gap: 12px;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    .single-input {
      flex: 1;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .single-input:focus {
      border-color: var(--accent-primary);
    }

    .reset-btn {
      background: rgba(244, 63, 94, 0.1);
      color: var(--accent-danger);
      border: 1px solid var(--accent-danger);
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .reset-btn:hover {
      background: var(--accent-danger);
      color: #fff;
    }

    /* Sections */
    .section-block {
      margin-bottom: 40px;
    }

    .section-heading {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease;
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 22px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 20px;
      line-height: 1.6;
      word-break: break-all;
      overflow-wrap: anywhere;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .btn {
      padding: 13px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      flex: 1;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .link-btn {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-success);
      border: 1px solid var(--accent-success);
    }

    .link-btn:hover {
      background: var(--accent-success);
      color: #020617;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .sub-header { font-size: 1rem; }
      .step-card { padding: 20px; }
      .prompt-content { font-size: 0.85rem; }
      .filter-wrapper { flex-direction: column; }
      .reset-btn { width: 100%; }
      .btn-group { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>R&D</h1>
      <p class="sub-header">(my process)</p>
    </header>

    <!-- Filter input field with Reset button -->
    <div class="filter-wrapper">
      <input 
        type="text" 
        id="promptSearch" 
        class="single-input" 
        placeholder="Search or filter prompts by title or URL..." 
        oninput="filterPrompts(this.value)" 
      />
      <button type="button" class="reset-btn" onclick="resetInputField('promptSearch')">
        Reset
      </button>
    </div>

    <!-- Sections & Prompts Container -->
    <div id="sectionsContainer">
      <!-- Injected by JavaScript -->
    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const sectionsData = [
      {
        sectionName: "Basics",
        prompts: [
          {
            id: 1,
            name: "Prompt",
            url: "https://spmhqo.github.io/rnd/my-impulsive.html",
            text: `https://spmhqo.github.io/rnd/my-impulsive.html`
          },
          {
            id: 2,
            name: "Skill Keywords",
            url: "https://spmhqo.github.io/rnd/find-skills.html",
            text: `https://spmhqo.github.io/rnd/find-skills.html`
          },
          {
            id: 3,
            name: "Combined Skill keywords",
            url: "https://spmhqo.github.io/rnd/combined-skill-keywords.html",
            text: `https://spmhqo.github.io/rnd/combined-skill-keywords.html`
          },
          {
            id: 4,
            name: "Compelling Keywords",
            url: "https://spmhqo.github.io/rnd/compelling-keywords.html",
            text: `https://spmhqo.github.io/rnd/compelling-keywords.html`
          },
          {
            id: 5,
            name: "Compulsive Content Idea",
            url: "https://spmhqo.github.io/rnd/c-c.html",
            text: `https://spmhqo.github.io/rnd/c-c.html`
          },
          {
            id: 6,
            name: "Compulsive Content Prompt and Image",
            url: "https://spmhqo.github.io/rnd/c-c.html",
            text: `https://spmhqo.github.io/rnd/c-c.html`
          }
        ]
      },
      {
        sectionName: "GAIB",
        prompts: [
          {
            id: 7,
            name: "Bangla",
            url: "https://spmhqo.github.io/rnd/gaib.html",
            text: `https://spmhqo.github.io/rnd/gaib.html`
          }
        ]
      },
      {
        sectionName: "Others",
        prompts: [
          {
            id: 8,
            name: "Develop Something New",
            url: "https://spmhqo.github.io/rnd/develop-something-new.html",
            text: `https://spmhqo.github.io/rnd/develop-something-new.html`
          },
          {
            id: 9,
            name: "DM Me",
            url: "https://spmhqo.github.io/rnd/dm-me.html",
            text: `https://spmhqo.github.io/rnd/dm-me.html`
          }
        ]
      }
    ];

    function renderCards() {
      const mainContainer = document.getElementById('sectionsContainer');
      mainContainer.innerHTML = '';

      sectionsData.forEach(section => {
        const sectionWrapper = document.createElement('div');
        sectionWrapper.className = 'section-block';
        sectionWrapper.id = `section-${section.sectionName.toLowerCase().replace(/\\s+/g, '-')}`;

        const heading = document.createElement('h2');
        heading.className = 'section-heading';
        heading.innerText = section.sectionName;
        sectionWrapper.appendChild(heading);

        const promptWorkflow = document.createElement('div');
        promptWorkflow.className = 'prompt-workflow';

        section.prompts.forEach(p => {
          const card = document.createElement('div');
          card.className = 'step-card';
          card.id = `card-${p.id}`;
          card.setAttribute('data-name', p.name.toLowerCase());
          card.setAttribute('data-text', p.text.toLowerCase());

          card.innerHTML = `
            <div class="step-header">
              <span class="step-label">${p.name}</span>
            </div>
            <div class="prompt-content" id="p${p.id}">${p.text}</div>
            <div class="btn-group">
              <button class="btn copy-btn" onclick="copyText('p${p.id}', this)">
                <span>Copy Prompt</span>
              </button>
              <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="btn link-btn">
                <span>Open Link</span>
              </a>
            </div>
          `;
          promptWorkflow.appendChild(card);
        });

        sectionWrapper.appendChild(promptWorkflow);
        mainContainer.appendChild(sectionWrapper);
      });
    }

    function copyText(id, btn) {
      const element = document.getElementById(id);
      if (!element) return;
      const text = element.innerText;

      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');

        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');

        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function filterPrompts(query) {
      const q = query.toLowerCase().trim();
      sectionsData.forEach(section => {
        let sectionVisibleCount = 0;
        section.prompts.forEach(p => {
          const card = document.getElementById(`card-${p.id}`);
          if (card) {
            const matches = !q || p.name.toLowerCase().includes(q) || p.text.toLowerCase().includes(q);
            if (matches) {
              card.style.display = 'block';
              sectionVisibleCount++;
            } else {
              card.style.display = 'none';
            }
          }
        });

        const sectionElem = document.getElementById(`section-${section.sectionName.toLowerCase().replace(/\\s+/g, '-')}`);
        if (sectionElem) {
          sectionElem.style.display = sectionVisibleCount > 0 ? 'block' : 'none';
        }
      });
    }

    // Reset button handler: clears input field and refreshes/restores all prompt boxes
    function resetInputField(fieldId) {
      const field = document.getElementById(fieldId);
      if (field) {
        field.value = '';
      }
      filterPrompts('');
    }

    window.onload = () => {
      renderCards();
    };
  </script>
</body>
</html>
